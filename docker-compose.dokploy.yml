# Dokploy stack for navigationes.eu
#
#   navigationes.eu / www.navigationes.eu  ->  web  (Blazor WebAssembly on nginx)
#   api.navigationes.eu                    ->  api  (ASP.NET Core)
#
# There is no database service here on purpose: this stack reuses the `mssql`
# container that already runs for Church Runner, with its own database and its own
# SQL login. See DEPLOY.md for the one-time setup that makes `mssql` reachable.
#
# Real values for every ${VAR} go in Dokploy's Environment tab, never in this file.

services:
  api:
    build:
      context: .
      dockerfile: NavigationES.Api/Dockerfile
    container_name: navigationes-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # OAuth callback URLs are built from Request.Scheme/Host, so the API has to
      # believe the public origin rather than the container's own.
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true

      - ConnectionStrings__NavigationESDb=Server=mssql,1433;Database=NavigationESDb;User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=True

      - Jwt__SecretKey=${JWT_SECRET}
      - Jwt__Issuer=https://api.navigationes.eu
      - Jwt__ExpireInMinute=10080

      # Where the API sends the browser after a social login, and the host of the
      # reset-password page linked from password-reset emails.
      - AppSettings__FrontendUrl=https://navigationes.eu

      # Only the browser client needs CORS; the MAUI app is exempt from same-origin.
      - Cors__AllowedOrigins__0=https://navigationes.eu
      - Cors__AllowedOrigins__1=https://www.navigationes.eu

      # Guards /api/admin/* (question and exam import). Fails closed if unset.
      - AdminSettings__ApiKey=${ADMIN_API_KEY}

      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - Authentication__Apple__ServicesId=${APPLE_SERVICES_ID}
      - Authentication__Apple__TeamId=${APPLE_TEAM_ID}
      - Authentication__Apple__KeyId=${APPLE_KEY_ID}
      - Authentication__Apple__PrivateKey=${APPLE_PRIVATE_KEY}
      - Authentication__Facebook__AppId=${FACEBOOK_APP_ID}
      - Authentication__Facebook__AppSecret=${FACEBOOK_APP_SECRET}

      - EmailSettings__SmtpServer=${SMTP_SERVER}
      - EmailSettings__SmtpPort=${SMTP_PORT}
      - EmailSettings__SenderEmail=${SMTP_SENDER_EMAIL}
      - EmailSettings__SenderName=NavigationES
      - EmailSettings__Username=${SMTP_USERNAME}
      - EmailSettings__Password=${SMTP_PASSWORD}
      - EmailSettings__EnableSsl=true
    networks:
      # `mssql` is reachable here too — DEPLOY.md attaches it to this same network.
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.navigationes-api.loadbalancer.server.port=8080"
      # HTTPS
      - "traefik.http.routers.navigationes-api.rule=Host(`api.navigationes.eu`)"
      - "traefik.http.routers.navigationes-api.entrypoints=websecure"
      - "traefik.http.routers.navigationes-api.tls=true"
      - "traefik.http.routers.navigationes-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.navigationes-api.service=navigationes-api"
      # HTTP -> HTTPS
      - "traefik.http.routers.navigationes-api-web.rule=Host(`api.navigationes.eu`)"
      - "traefik.http.routers.navigationes-api-web.entrypoints=web"
      - "traefik.http.routers.navigationes-api-web.middlewares=navigationes-https"
      - "traefik.http.middlewares.navigationes-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.navigationes-https.redirectscheme.permanent=true"

  web:
    build:
      context: .
      dockerfile: NavigationES.Web/Dockerfile
    container_name: navigationes-web
    restart: unless-stopped
    environment:
      # Baked into wwwroot/appsettings.json at container start, not at build time.
      - API_BASE_URL=https://api.navigationes.eu/
    depends_on:
      - api
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.navigationes-web.loadbalancer.server.port=80"
      # HTTPS
      - "traefik.http.routers.navigationes-web.rule=Host(`navigationes.eu`) || Host(`www.navigationes.eu`)"
      - "traefik.http.routers.navigationes-web.entrypoints=websecure"
      - "traefik.http.routers.navigationes-web.tls=true"
      - "traefik.http.routers.navigationes-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.navigationes-web.service=navigationes-web"
      # HTTP -> HTTPS
      - "traefik.http.routers.navigationes-web-http.rule=Host(`navigationes.eu`) || Host(`www.navigationes.eu`)"
      - "traefik.http.routers.navigationes-web-http.entrypoints=web"
      - "traefik.http.routers.navigationes-web-http.middlewares=navigationes-https"
      - "traefik.http.routers.navigationes-web-http.service=navigationes-web"

networks:
  dokploy-network:
    external: true
