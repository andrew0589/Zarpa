<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=block" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  body{width:1080px;height:1920px;background:#0B3D5C;font-family:"Plus Jakarta Sans","Segoe UI",sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}
  svg.logo{width:260px;height:260px}
  .name{margin-top:30px;font-size:96px;font-weight:800;letter-spacing:-2px}
  .name span{color:#3CC2BC}
  .tag{margin-top:34px;font-size:42px;font-weight:600;color:#E6EEF3;padding:0 70px;line-height:1.3}
  .cta{margin-top:90px;background:#3CC2BC;color:#0B3D5C;font-size:46px;font-weight:800;padding:26px 56px;border-radius:999px}
  .url{margin-top:36px;font-size:48px;font-weight:800;color:#fff}
  .waves{position:absolute;left:0;right:0;bottom:-10px;opacity:.12;width:1080px;height:260px}
</style></head>
<body>
  <svg class="logo" viewBox="0 0 64 64"><polygon points="32,4 40,30 24,30" fill="#3CC2BC"/><polygon points="24,30 40,30 32,40" fill="#FFFFFF"/><path d="M8 49 q6 -5.5 12 0 t12 0 t12 0 t12 0" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/><path d="M8 58 q6 -5.5 12 0 t12 0 t12 0 t12 0" fill="none" stroke="#3CC2BC" stroke-width="4" stroke-linecap="round"/></svg>
  <div class="name">Navigation<span>ES</span></div>
  <div class="tag">PNB · PER · Patrón y Capitán de Yate</div>
  <div class="cta">Prueba 7 días gratis</div>
  <div class="url">navigationes.eu</div>
  <svg class="waves" viewBox="0 0 1080 260" preserveAspectRatio="none">
    <path d="M0 100 q67.5 -55 135 0 t135 0 t135 0 t135 0 t135 0 t135 0 t135 0 t135 0" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round"/>
    <path d="M0 180 q67.5 -55 135 0 t135 0 t135 0 t135 0 t135 0 t135 0 t135 0 t135 0" fill="none" stroke="#3CC2BC" stroke-width="20" stroke-linecap="round"/>
  </svg>
</body></html>
