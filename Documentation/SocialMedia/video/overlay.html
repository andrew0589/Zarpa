<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=block" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{width:1080px;height:1920px;position:relative;font-family:"Plus Jakarta Sans","Segoe UI",sans-serif;color:#fff}
  .top{position:absolute;top:200px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:22px}
  .top svg{width:96px;height:96px}
  .name{font-size:72px;font-weight:800;letter-spacing:-1.5px}
  .name span{color:#3CC2BC}
  .badge{position:absolute;top:340px;left:0;right:0;text-align:center}
  .badge span{display:inline-block;background:#3CC2BC;color:#0B3D5C;font-weight:800;font-size:34px;padding:12px 30px;border-radius:999px}
  .bottom{position:absolute;bottom:340px;left:60px;right:60px;text-align:center}
  .q{font-size:48px;font-weight:800;line-height:1.15}
  .s{margin-top:22px;font-size:36px;font-weight:600;color:#C9D8E2}
  .url{margin-top:44px;font-size:42px;font-weight:800;color:#3CC2BC}
</style></head>
<body>
  <div class="top">
    <svg viewBox="0 0 64 64"><polygon points="32,4 40,30 24,30" fill="#3CC2BC"/><polygon points="24,30 40,30 32,40" fill="#FFFFFF"/><path d="M8 49 q6 -5.5 12 0 t12 0 t12 0 t12 0" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/><path d="M8 58 q6 -5.5 12 0 t12 0 t12 0 t12 0" fill="none" stroke="#3CC2BC" stroke-width="4" stroke-linecap="round"/></svg>
    <div class="name">Navigation<span>ES</span></div>
  </div>
  <div class="badge"><span>Nomenclatura náutica · PNB · PER</span></div>
  <div class="bottom">
    <div class="q">¿Te preparas el PNB, PER,<br>Patrón de Yate o Capitán de Yate?</div>
    <div class="s">Tests y exámenes reales de tu comunidad</div>
    <div class="url">navigationes.eu</div>
  </div>
</body></html>
