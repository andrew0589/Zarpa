<svg viewBox="0 0 1000 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <rect x="80" y="470" width="840" height="40" rx="6" fill="#E6EEF3" stroke="#0B3D5C" stroke-width="5"/>
  <text x="500" y="500" text-anchor="middle" font-size="22" fill="#24465E">cubierta</text>
  <!-- manguerote: tubo vertical y boca curvada hacia sotavento -->
  <path d="M470 470 L470 290 Q470 170 590 170 L640 170 L640 290 L590 290 Q530 290 530 330 L530 470 Z" fill="#FFFFFF" stroke="#0B3D5C" stroke-width="6" stroke-linejoin="round"/>
  <ellipse cx="640" cy="230" rx="22" ry="60" fill="#0B3D5C"/>
  <!-- viento -->
  <g stroke="#3CC2BC" stroke-width="9" stroke-linecap="round" fill="#3CC2BC">
    <line x1="110" y1="200" x2="330" y2="200"/><polygon points="360,200 322,182 322,218" stroke-width="0"/>
    <line x1="80" y1="270" x2="330" y2="270"/><polygon points="360,270 322,252 322,288" stroke-width="0"/>
    <line x1="110" y1="340" x2="330" y2="340"/><polygon points="360,340 322,322 322,358" stroke-width="0"/>
  </g>
  <text x="220" y="150" text-anchor="middle" font-size="34" font-weight="800" fill="#1F8E89">VIENTO</text>
  <text x="200" y="570" text-anchor="middle" font-size="34" font-weight="800" fill="#0B3D5C">BARLOVENTO</text>
  <text x="200" y="420" text-anchor="middle" font-size="22" fill="#24465E">de donde viene el viento</text>
  <text x="800" y="570" text-anchor="middle" font-size="34" font-weight="800" fill="#0B3D5C">SOTAVENTO</text>
  <text x="800" y="420" text-anchor="middle" font-size="22" fill="#24465E">hacia donde va</text>
  <text x="700" y="140" font-size="28" font-weight="700" fill="#0B3D5C">boca a sotavento</text>
  <line x1="740" y1="150" x2="668" y2="205" stroke="#12324A" stroke-width="2.5" stroke-dasharray="6 6"/>
</svg>
