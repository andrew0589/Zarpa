  <g font-weight="800" font-size="36">
    <text x="580" y="85" fill="#0B3D5C">ARGANEO</text>
    <text x="560" y="380" fill="#0B3D5C">CAÑA</text>
    <text x="500" y="700" text-anchor="middle" fill="#0B3D5C">CRUZ</text>
    <text x="300" y="590" text-anchor="end" fill="#0B3D5C">BRAZO</text>
    <text x="700" y="590" fill="#0B3D5C">BRAZO</text>
    <text x="150" y="340" fill="#0B3D5C">UÑA</text>
    <text x="780" y="340" fill="#0B3D5C">UÑA</text>
  </g>
  <text x="700" y="168" font-size="24" fill="#6A8296">cepo (anclas antiguas)</text>
  <text x="580" y="118" font-size="22" fill="#24465E">aquí va el grillete</text>
  <g stroke="#12324A" stroke-width="2.5" stroke-dasharray="6 6">
    <line x1="500" y1="670" x2="500" y2="640"/>
    <line x1="300" y1="580" x2="350" y2="590"/><line x1="700" y1="580" x2="650" y2="590"/>
