  <!-- arganeo -->
  <circle cx="500" cy="95" r="40" fill="none" stroke="#3D4A54" stroke-width="16"/>
  <!-- caña -->
  <rect x="484" y="130" width="32" height="470" rx="8" fill="#5B6770"/>
  <!-- brazos -->
  <path d="M500 610 Q330 620 250 450" fill="none" stroke="#5B6770" stroke-width="30" stroke-linecap="round"/>
  <path d="M500 610 Q670 620 750 450" fill="none" stroke="#5B6770" stroke-width="30" stroke-linecap="round"/>
  <!-- uñas -->
  <path d="M250 450 L195 420 L240 360 L292 420 Z" fill="#3D4A54"/>
  <path d="M750 450 L805 420 L760 360 L708 420 Z" fill="#3D4A54"/>
