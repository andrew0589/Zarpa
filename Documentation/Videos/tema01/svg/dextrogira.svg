    <g transform="translate(1050 360) scale(-1 1)"><use href="#dx-pala"/><use href="#dx-pala" transform="rotate(120)"/><use href="#dx-pala" transform="rotate(240)"/><circle r="38" fill="#B08A36"/></g>
