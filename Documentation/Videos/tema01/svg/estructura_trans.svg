<svg viewBox="0 0 1000 720" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <!-- forro del casco -->
  <path d="M150 165 L162 420 Q185 640 500 640 Q815 640 838 420 L850 165" fill="#F7FAFC" stroke="#0B3D5C" stroke-width="6"/>
  <!-- cubierta sobre los baos -->
  <rect x="150" y="140" width="700" height="22" rx="4" fill="#D9B98C" stroke="#7A5530" stroke-width="3"/>
  <!-- bao -->
  <rect x="172" y="164" width="656" height="26" rx="6" fill="#C9864F" stroke="#7A3F14" stroke-width="3"/>
  <!-- cuaderna -->
  <path d="M185 190 L196 420 Q218 612 500 612 Q782 612 804 420 L815 190" fill="none" stroke="#9C5A2B" stroke-width="26" stroke-linejoin="round"/>
  <!-- quilla -->
  <rect x="460" y="612" width="80" height="56" rx="6" fill="#7A3F14"/>
  <g font-weight="800" font-size="36">
    <text x="500" y="110" text-anchor="middle" fill="#7A5530">CUBIERTA</text>
    <text x="500" y="250" text-anchor="middle" fill="#9C5A2B">BAO</text>
    <text x="500" y="420" text-anchor="middle" fill="#9C5A2B">CUADERNA</text>
    <text x="500" y="710" text-anchor="middle" fill="#7A3F14">QUILLA</text>
  </g>
  <g font-size="22" fill="#24465E" text-anchor="middle">
    <text x="500" y="282">une los extremos de las cuadernas</text>
    <text x="500" y="452">sube de la quilla por los costados</text>
  </g>
  <g stroke="#12324A" stroke-width="2.5" stroke-dasharray="6 6">
    <line x1="500" y1="225" x2="500" y2="192"/>
    
  </g>
  <text x="900" y="420" font-size="26" fill="#0B3D5C" font-weight="700" text-anchor="middle">costado</text>
</svg>
