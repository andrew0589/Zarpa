<svg viewBox="0 0 1600 520" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <text x="40" y="60" font-size="34" font-weight="800" fill="#1F7A8C">FONDEAR</text>
  <text x="40" y="320" font-size="34" font-weight="800" fill="#7B2D8B">LEVAR ANCLAS</text>
  <g font-size="28" font-weight="800" text-anchor="middle">
    <rect x="40" y="90" width="300" height="110" rx="18" fill="#DDF1F4" stroke="#1F7A8C" stroke-width="4"/>
    <text x="190" y="140" fill="#0B3D5C">A la pendura</text>
    <text x="190" y="175" font-size="22" font-weight="500" fill="#24465E">colgando, lista</text>
    <rect x="420" y="90" width="300" height="110" rx="18" fill="#DDF1F4" stroke="#1F7A8C" stroke-width="4"/>
    <text x="570" y="140" fill="#0B3D5C">A pique</text>
    <text x="570" y="175" font-size="22" font-weight="500" fill="#24465E">toca el fondo</text>
    <rect x="800" y="90" width="300" height="110" rx="18" fill="#DDF1F4" stroke="#1F7A8C" stroke-width="4"/>
    <text x="950" y="140" fill="#0B3D5C">Filar</text>
    <text x="950" y="175" font-size="22" font-weight="500" fill="#24465E">largar cadena</text>

    <rect x="40" y="350" width="300" height="110" rx="18" fill="#F1E3F4" stroke="#7B2D8B" stroke-width="4"/>
    <text x="190" y="400" fill="#0B3D5C">Virar</text>
    <text x="190" y="435" font-size="22" font-weight="500" fill="#24465E">cobrar cadena</text>
    <rect x="420" y="350" width="300" height="110" rx="18" fill="#F1E3F4" stroke="#7B2D8B" stroke-width="4"/>
    <text x="570" y="400" fill="#0B3D5C">A pique</text>
    <text x="570" y="435" font-size="22" font-weight="500" fill="#24465E">cadena vertical</text>
    <rect x="800" y="350" width="300" height="110" rx="18" fill="#F1E3F4" stroke="#7B2D8B" stroke-width="4"/>
    <text x="950" y="400" fill="#0B3D5C">Zarpa</text>
    <text x="950" y="435" font-size="22" font-weight="500" fill="#24465E">se despega del fondo</text>
    <rect x="1180" y="350" width="380" height="110" rx="18" fill="#7B2D8B"/>
    <text x="1370" y="400" fill="#FFFFFF">¡Clara y libre!</text>
    <text x="1370" y="435" font-size="22" font-weight="500" fill="#F1E3F4">sin fango, algas ni cabos</text>
  </g>
  <g fill="#12324A">
    <polygon points="395,145 360,128 360,162"/><polygon points="775,145 740,128 740,162"/>
    <polygon points="395,405 360,388 360,422"/><polygon points="775,405 740,388 740,422"/><polygon points="1155,405 1120,388 1120,422"/>
  </g>
</svg>
