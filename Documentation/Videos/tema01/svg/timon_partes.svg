<svg viewBox="0 0 1180 700" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <!-- casco (popa, en corte) -->
  <path d="M30 260 L770 260 L725 432 Q420 470 30 470 Z" fill="#FFFFFF" stroke="#0B3D5C" stroke-width="6" stroke-linejoin="round"/>
  <rect x="30" y="250" width="740" height="12" fill="#D9B98C"/>
  <!-- mecha -->
  <rect x="632" y="215" width="16" height="250" fill="#5B6770"/>
  <!-- limera -->
  <rect x="616" y="428" width="48" height="22" rx="4" fill="#E07A1F" stroke="#9A4F0B" stroke-width="3"/>
  <!-- pala -->
  <path d="M640 462 L640 650 L735 650 Q768 560 742 462 Z" fill="#8E2A2A" stroke="#5E1515" stroke-width="4"/>
  <!-- caña -->
  <path d="M640 225 L420 205" stroke="#9C5A2B" stroke-width="20" stroke-linecap="round"/>
  <circle cx="640" cy="225" r="14" fill="#5B6770"/>
  <!-- mar -->
  <rect x="0" y="400" width="1180" height="300" fill="#9FD0EA" opacity=".55"/>
  <path d="M0 400 q42 -14 84 0 t84 0 t84 0 t84 0 t84 0 t84 0 t84 0 t84 0 t84 0 t84 0 t84 0 t84 0 t84 0 t84 0" fill="none" stroke="#3C8DBC" stroke-width="5"/>
  <!-- rótulos -->
  <g font-size="36" font-weight="800" stroke="#F4F7FA" stroke-width="8" paint-order="stroke">
    <text x="420" y="160" fill="#9C5A2B">CAÑA</text>
    <text x="820" y="300" fill="#3D4A54">MECHA</text>
    <text x="820" y="420" fill="#B85A00">LIMERA</text>
    <text x="820" y="580" fill="#8E2A2A">PALA</text>
  </g>
  <g font-size="22" fill="#24465E" stroke="#F4F7FA" stroke-width="6" paint-order="stroke">
    <text x="820" y="330">eje del timón</text>
    <text x="820" y="450">paso de la mecha por el casco</text>
    <text x="820" y="610">cambia el rumbo</text>
    <text x="40" y="440">← proa</text>
    <text x="40" y="385">línea de flotación</text>
  </g>
  <g stroke="#12324A" stroke-width="2.5" stroke-dasharray="6 6">
    <line x1="480" y1="170" x2="510" y2="208"/>
    <line x1="815" y1="292" x2="652" y2="330"/>
    <line x1="815" y1="412" x2="666" y2="438"/>
    <line x1="815" y1="572" x2="745" y2="570"/>
  </g>
</svg>
