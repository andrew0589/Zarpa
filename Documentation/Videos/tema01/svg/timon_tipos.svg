<svg viewBox="0 0 1400 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <line x1="700" y1="40" x2="700" y2="560" stroke="#C9D8E2" stroke-width="3" stroke-dasharray="10 10"/>
  <g font-size="38" font-weight="800" fill="#0B3D5C" text-anchor="middle">
    <text x="350" y="70">Timón ordinario</text>
    <text x="1050" y="70">Timón compensado</text>
  </g>
  <!-- fondo del casco -->
  <g fill="#F4F7FA" stroke="#0B3D5C" stroke-width="5">
    <path d="M60 120 L620 120 L600 180 L60 180 Z"/>
    <path d="M760 120 L1320 120 L1300 180 L760 180 Z"/>
  </g>
  <!-- ordinario: eje en el canto de proa -->
  <rect x="292" y="140" width="16" height="70" fill="#5B6770"/>
  <path d="M300 205 L300 420 L450 420 Q480 320 455 205 Z" fill="#8E2A2A" stroke="#5E1515" stroke-width="4"/>
  <line x1="300" y1="190" x2="300" y2="450" stroke="#E07A1F" stroke-width="5" stroke-dasharray="14 8"/>
  <!-- compensado: eje hacia el centro -->
  <rect x="1002" y="140" width="16" height="70" fill="#5B6770"/>
  <path d="M955 205 L955 420 L1130 420 Q1160 320 1135 205 Z" fill="#8E2A2A" stroke="#5E1515" stroke-width="4"/>
  <line x1="1010" y1="190" x2="1010" y2="450" stroke="#E07A1F" stroke-width="5" stroke-dasharray="14 8"/>
  <!-- flechas de giro -->
  <g fill="none" stroke="#1F7A8C" stroke-width="6" stroke-linecap="round">
    <path d="M250 470 Q300 500 350 470"/><path d="M960 470 Q1010 500 1060 470"/>
  </g>
  <g fill="#1F7A8C"><polygon points="360,462 342,462 352,480"/><polygon points="1070,462 1052,462 1062,480"/></g>
  <g font-size="26" fill="#12324A" text-anchor="middle">
    <text x="350" y="530">eje en el extremo de proa de la pala</text>
    <text x="1050" y="530">eje más o menos en el centro</text>
  </g>
  <g font-size="26" font-weight="700" text-anchor="middle">
    <text x="350" y="570" fill="#1E7A30">más sensible · más esfuerzo</text>
    <text x="1050" y="570" fill="#1E7A30">menos esfuerzo · algo menos sensible</text>
  </g>
  <text x="70" y="160" font-size="24" fill="#24465E">← proa</text>
  <text x="770" y="160" font-size="24" fill="#24465E">← proa</text>
</svg>
