<svg viewBox="0 0 1000 640" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="bs-f" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#D8ECF7"/>
  <!-- barco visto desde arriba -->
  <path d="M500 70 C 600 160, 640 300, 630 570 L370 570 C 360 300, 400 160, 500 70 Z" fill="#FFFFFF" stroke="#0B3D5C" stroke-width="6"/>
  <path d="M440 300 L560 300 L555 440 L445 440 Z" fill="#EEF3F7" stroke="#0B3D5C" stroke-width="3"/>
  <!-- banda de barlovento / sotavento -->
  <path d="M500 70 C 400 160, 360 300, 370 570" fill="none" stroke="#1F7A8C" stroke-width="16" opacity=".8"/>
  <path d="M500 70 C 600 160, 640 300, 630 570" fill="none" stroke="#E07A1F" stroke-width="16" opacity=".8"/>
  <!-- viento -->
  <g stroke="#1F7A8C" stroke-width="8" marker-end="url(#bs-f)">
    <line x1="40" y1="230" x2="250" y2="230"/><line x1="40" y1="330" x2="250" y2="330"/><line x1="40" y1="430" x2="250" y2="430"/>
  </g>
  <g stroke="#7FB4C4" stroke-width="6" marker-end="url(#bs-f)" stroke-dasharray="14 8">
    <line x1="720" y1="250" x2="940" y2="250"/><line x1="720" y1="410" x2="940" y2="410"/>
  </g>
  <g font-weight="800" text-anchor="middle">
    <text x="150" y="150" font-size="36" fill="#1F7A8C">BARLOVENTO</text>
    <text x="150" y="185" font-size="22" fill="#24465E" font-weight="500">de donde viene el viento</text>
    <text x="840" y="150" font-size="36" fill="#B85A00">SOTAVENTO</text>
    <text x="840" y="185" font-size="22" fill="#24465E" font-weight="500">hacia donde va</text>
    <text x="500" y="40" font-size="26" fill="#0B3D5C">PROA</text>
    <text x="145" y="520" font-size="24" fill="#1F7A8C">banda de barlovento</text>
    <text x="850" y="520" font-size="24" fill="#B85A00">banda de sotavento</text>
  </g>
</svg>
