    <text x="105" y="225" font-size="30" fill="#1F7A8C">viento</text>
    <text x="330" y="560" font-size="26" fill="#8A6A22">cabo / costa</text>
    <text x="700" y="260" font-size="34" fill="#1E7A30">SOCAIRE</text>
    <text x="700" y="400" font-size="22" fill="#24465E" font-weight="500">zona protegida: no llega el viento</text>
  </g>
