<svg viewBox="0 -70 1400 690" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <defs>
    <g id="ec-barco">
      <line x1="0" y1="-60" x2="0" y2="-330" stroke="#5B6770" stroke-width="10" stroke-linecap="round"/>
      <path d="M6 -320 L6 -80 L130 -80 Z" fill="#F7FAFC" stroke="#9FB4C4" stroke-width="3"/>
      <path d="M-12 60 L12 60 L8 170 L-8 170 Z" fill="#8E2A2A"/>
      <path d="M-125 -60 L125 -60 L108 30 Q0 82 -108 30 Z" fill="#FFFFFF" stroke="#0B3D5C" stroke-width="6" stroke-linejoin="round"/>
    </g>
    <marker id="ec-f" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker>
  </defs>
  <line x1="700" y1="-60" x2="700" y2="600" stroke="#C9D8E2" stroke-width="3" stroke-dasharray="10 10"/>
  <!-- escorado -->
  <line x1="350" y1="330" x2="350" y2="60" stroke="#9FB4C4" stroke-width="3" stroke-dasharray="10 8"/>
  <use href="#ec-barco" transform="translate(350 330) rotate(20)"/>
  <path d="M350 100 A230 230 0 0 1 428.7 113.9" fill="none" stroke="#E07A1F" stroke-width="6"/>
  <text x="440" y="96" font-size="26" font-weight="800" fill="#B85A00">escora</text>
  <g stroke="#1F7A8C" stroke-width="7" marker-end="url(#ec-f)">
    <line x1="40" y1="150" x2="190" y2="150"/><line x1="40" y1="220" x2="190" y2="220"/><line x1="40" y1="290" x2="190" y2="290"/>
  </g>
  <text x="115" y="120" text-anchor="middle" font-size="28" font-weight="800" fill="#1F7A8C">viento</text>
  <!-- adrizado -->
  <use href="#ec-barco" transform="translate(1050 330)"/>
  <!-- agua -->
  <rect x="0" y="330" width="1400" height="290" fill="#9FD0EA" opacity=".55"/>
  <path d="M0 330 q50 -14 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0" fill="none" stroke="#3C8DBC" stroke-width="5"/>
  <!-- balanceo -->
  <path d="M250 560 Q350 610 450 560" fill="none" stroke="#7B2D8B" stroke-width="6" marker-start="url(#ec-f)" marker-end="url(#ec-f)"/>
  <g text-anchor="middle" font-weight="800">
    <text x="350" y="-25" font-size="40" fill="#0B3D5C">ESCORADO</text>
    <text x="1050" y="-25" font-size="40" fill="#0B3D5C">ADRIZADO</text>
    <text x="350" y="540" font-size="26" fill="#7B2D8B">balanceo: de banda a banda</text>
    <text x="1050" y="560" font-size="28" fill="#1E7A30">posición natural, sin escora</text>
  </g>
</svg>
