<svg viewBox="0 0 1200 900" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <defs>
    <linearGradient id="rd-inox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F7FA"/><stop offset=".5" stop-color="#B9C6CF"/><stop offset="1" stop-color="#7E8D98"/>
    </linearGradient>
    <linearGradient id="rd-rueda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A6B78"/><stop offset="1" stop-color="#2E3A43"/>
    </linearGradient>
    <pattern id="rd-cabo" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="22" height="22" fill="#F6F1E4"/><rect width="9" height="22" fill="#E2D8C0"/>
      <circle cx="16" cy="6" r="2.4" fill="#1F4E8C"/>
    </pattern>
    <marker id="rd-f" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1F7A8C"/></marker>
  </defs>
  <rect width="1200" height="900" fill="#EAF3F8"/>
  <!-- cubierta -->
  <rect x="0" y="760" width="1200" height="140" fill="#C99A63"/>
  <g stroke="#3D2A16" stroke-width="5" opacity=".55">
    <line x1="0" y1="790" x2="1200" y2="790"/><line x1="0" y1="825" x2="1200" y2="825"/><line x1="0" y1="860" x2="1200" y2="860"/>
  </g>
  <!-- grillete / anclaje -->
  <path d="M560 760 L560 715 Q600 680 640 715 L640 760" fill="none" stroke="url(#rd-inox)" stroke-width="22"/>
  <!-- carcasa del motón (cortada) -->
  <path d="M600 140 C 820 140 860 320 840 470 C 820 600 720 690 600 700 C 480 690 380 600 360 470 C 340 320 380 140 600 140 Z" fill="url(#rd-inox)" stroke="#5B6770" stroke-width="6"/>
  <path d="M600 200 C 760 200 790 330 775 450 C 760 560 690 630 600 638 C 510 630 440 560 425 450 C 410 330 440 200 600 200 Z" fill="#DCE5EB" stroke="#9FB4C4" stroke-width="4" stroke-dasharray="14 10"/>
  <!-- roldana -->
  <circle cx="600" cy="420" r="185" fill="url(#rd-rueda)"/>
  <circle cx="600" cy="420" r="150" fill="none" stroke="#7FA6BF" stroke-width="10"/>
  <circle cx="600" cy="420" r="38" fill="#C7D3DB" stroke="#5B6770" stroke-width="6"/>
  <circle cx="600" cy="420" r="12" fill="#2E3A43"/>
  <g stroke="#7FA6BF" stroke-width="8"><line x1="600" y1="300" x2="600" y2="382"/><line x1="600" y1="458" x2="600" y2="540"/><line x1="480" y1="420" x2="562" y2="420"/><line x1="638" y1="420" x2="720" y2="420"/></g>
  <!-- cabo sobre la roldana -->
  <path d="M120 20 L120 40 C 120 260 250 240 420 300 A 190 190 0 0 1 780 300 C 900 250 1000 180 1180 160" fill="none" stroke="#B9A985" stroke-width="58" stroke-linecap="round"/>
  <path d="M120 20 L120 40 C 120 260 250 240 420 300 A 190 190 0 0 1 780 300 C 900 250 1000 180 1180 160" fill="none" stroke="url(#rd-cabo)" stroke-width="50" stroke-linecap="round"/>
  <!-- giro -->
  <path d="M430 610 A 215 215 0 0 0 770 610" fill="none" stroke="#1F7A8C" stroke-width="12" marker-end="url(#rd-f)"/>
  <g stroke="#1F7A8C" stroke-width="10" marker-end="url(#rd-f)">
    <line x1="980" y1="250" x2="1110" y2="205"/>
    <line x1="120" y1="200" x2="120" y2="90" />
  </g>
  <!-- rótulos -->
  <g font-weight="800" font-size="46" fill="#0B3D5C" stroke="#EAF3F8" stroke-width="10" paint-order="stroke">
    <text x="880" y="560">Roldana</text>
    <text x="900" y="120">Cabo</text>
    <text x="40" y="560">Motón</text>
  </g>
  <g font-size="28" fill="#24465E" stroke="#EAF3F8" stroke-width="8" paint-order="stroke">
    <text x="880" y="600">gira con el cabo</text>
    <text x="40" y="600">la caja que la contiene</text>
  </g>
  <g stroke="#12324A" stroke-width="3" stroke-dasharray="8 7">
    <line x1="875" y1="545" x2="745" y2="470"/>
    <line x1="230" y1="545" x2="365" y2="500"/>
    <line x1="960" y1="132" x2="930" y2="195"/>
  </g>
</svg>
