<svg viewBox="0 0 1400 900" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <defs>
    <pattern id="bz-amarra" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="24" height="24" fill="#F6F1E4"/><rect width="10" height="24" fill="#E2D8C0"/><circle cx="17" cy="7" r="2.6" fill="#1F4E8C"/>
    </pattern>
    <pattern id="bz-boza" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="16" height="16" fill="#E07A1F"/><rect width="6" height="16" fill="#B85A00"/>
    </pattern>
    <linearGradient id="bz-inox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7FA"/><stop offset="1" stop-color="#8A97A1"/>
    </linearGradient>
    <marker id="bz-f" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B71C1C"/></marker>
  </defs>
  <rect width="1400" height="900" fill="#EAF3F8"/>
  <!-- cubierta de teca vista desde arriba -->
  <rect x="0" y="0" width="1100" height="900" fill="#C99A63"/>
  <g stroke="#3D2A16" stroke-width="5" opacity=".5">
    <line x1="0" y1="110" x2="1100" y2="110"/><line x1="0" y1="230" x2="1100" y2="230"/><line x1="0" y1="350" x2="1100" y2="350"/>
    <line x1="0" y1="470" x2="1100" y2="470"/><line x1="0" y1="590" x2="1100" y2="590"/><line x1="0" y1="710" x2="1100" y2="710"/><line x1="0" y1="830" x2="1100" y2="830"/>
  </g>
  <!-- borda y agua -->
  <rect x="1100" y="0" width="40" height="900" fill="#FFFFFF" stroke="#0B3D5C" stroke-width="5"/>
  <rect x="1140" y="0" width="260" height="900" fill="#5FA8D3"/>
  <!-- guía-cabos -->
  <rect x="1080" y="300" width="80" height="80" rx="18" fill="url(#bz-inox)" stroke="#5B6770" stroke-width="5"/>
  <!-- cornamusa de la boza -->
  <g transform="translate(360 640)">
    <rect x="-130" y="-22" width="260" height="44" rx="22" fill="url(#bz-inox)" stroke="#5B6770" stroke-width="5"/>
    <rect x="-40" y="-40" width="80" height="80" rx="14" fill="url(#bz-inox)" stroke="#5B6770" stroke-width="5"/>
  </g>
  <!-- winche -->
  <circle cx="160" cy="340" r="95" fill="url(#bz-inox)" stroke="#5B6770" stroke-width="6"/>
  <circle cx="160" cy="340" r="45" fill="#B9C6CF" stroke="#5B6770" stroke-width="5"/>
  <!-- amarra en tensión: del winche al guía-cabos y al muelle -->
  <path d="M255 340 L1400 340" stroke="#B9A985" stroke-width="44"/>
  <path d="M255 340 L1400 340" stroke="url(#bz-amarra)" stroke-width="36"/>
  <!-- parte floja de la amarra tras la boza (ya fuera del winche) -->
  <path d="M255 340 C 230 470 120 520 140 650 C 160 760 300 800 260 880" fill="none" stroke="#B9A985" stroke-width="40" stroke-linecap="round" opacity=".9"/>
  <path d="M255 340 C 230 470 120 520 140 650 C 160 760 300 800 260 880" fill="none" stroke="url(#bz-amarra)" stroke-width="32" stroke-linecap="round" opacity=".9"/>
  <!-- boza: vueltas sobre la amarra y firme en la cornamusa -->
  <g stroke="#7A3A00" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M610 306 L640 374"/><path d="M650 306 L680 374"/><path d="M690 306 L720 374"/><path d="M740 306 L770 374"/>
  </g>
  <g stroke="url(#bz-boza)" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M610 306 L640 374"/><path d="M650 306 L680 374"/><path d="M690 306 L720 374"/><path d="M740 306 L770 374"/>
  </g>
  <path d="M630 378 C 560 470 470 560 430 640 C 410 680 340 690 290 650 C 250 615 300 600 360 640" fill="none" stroke="#7A3A00" stroke-width="22" stroke-linecap="round"/>
  <path d="M630 378 C 560 470 470 560 430 640 C 410 680 340 690 290 650 C 250 615 300 600 360 640" fill="none" stroke="url(#bz-boza)" stroke-width="16" stroke-linecap="round"/>
  <!-- tensión -->
  <g stroke="#B71C1C" stroke-width="10" marker-end="url(#bz-f)">
    <line x1="1180" y1="270" x2="1360" y2="270"/>
  </g>
  <!-- rótulos -->
  <g font-weight="800" font-size="46" stroke="#C99A63" stroke-width="10" paint-order="stroke">
    <text x="600" y="292" fill="#0B3D5C">Cabo en tensión</text>
    <text x="560" y="445" fill="#7A3A00">Boza</text>
    <text x="40" y="200" fill="#3D4A54">Winche</text>
  </g>
  <text x="1185" y="240" font-size="30" font-weight="800" fill="#FFFFFF">al muelle</text>
  <g font-size="28" fill="#2B1A08" stroke="#C99A63" stroke-width="8" paint-order="stroke">
    <text x="560" y="522">sujeta la carga</text>
    <text x="560" y="558">mientras se maneja el cabo</text>
    <text x="40" y="772" font-weight="700">cabo libre,</text>
    <text x="40" y="808" font-weight="700">ya se puede manipular</text>
  </g>
</svg>
