server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Blazor's publish step writes .gz siblings for the framework payload; serving
    # those directly is the difference between a ~2 MB and a ~7 MB first load.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm application/octet-stream image/svg+xml;

    # nginx's bundled mime.types already maps .wasm to application/wasm — do NOT add a
    # types { } block here, it would replace the inherited map and break css/js.

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Container HEALTHCHECK target — never reaches the SPA fallback.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Rewritten at container start by 10-api-base-url.sh, so it must never be cached.
    location = /appsettings.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The entry point for every deploy: a cached index.html would keep serving the
    # previous build's asset fingerprints.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # .NET 10 embeds the boot config in the fingerprinted loader .js, so this matches
    # nothing today. Kept because earlier and possibly later SDKs emit a plain
    # blazor.boot.json here, which changes every build and must never be cached.
    location ~ ^/_framework/.*\.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Fingerprinted runtime + assemblies: the filename changes when the content does.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Crawlable public pages (calendar, comunidades, topic tests, sitemap, their
    # images) are rendered by the API from the database — see PublicSiteEndpoints.
    # Proxied rather than linked to api.navigationes.eu so they rank on this origin.
    # Never a prefix the SPA routes itself (/temas, /examen): a reload there must
    # reach index.html, not the API.
    # Docker's DNS + a variable: the upstream is resolved per request, so nginx
    # still starts (and the SPA still works) while the API container is down.
    location ~ ^/(examenes|test|img)(/|$) {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api http://navigationes-api:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        # Traefik terminated TLS; the API's HTTPS redirect must see "https".
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /sitemap.xml {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api http://navigationes-api:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Client-side routing: the SPA's own routes have no file on disk, so they get
    # index.html with 200. KEEP IN SYNC with the @page directives in
    # NavigationES.Web/Pages — a route missing here still works (the SPA renders
    # it), it just answers 404 to crawlers.
    location ~ ^/(admin/(contenido|convocatorias|usuarios)|auth-callback|estudiar|examen(/[0-9]+)?|not-found|perfil|signin|signup|temas(/[0-9]+)?|verificar-email)/?$ {
        rewrite ^ /index.html last;
    }

    # Real assets, or a real 404 for everything else. The 404 still carries
    # index.html, so a person sees the SPA's "Página no encontrada" — but search
    # engines get the status instead of a "soft 404" with 200.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
}
