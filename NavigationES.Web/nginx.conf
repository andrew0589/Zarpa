server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Blazor's publish step writes .gz siblings for the framework payload; serving
    # those directly is the difference between a ~2 MB and a ~7 MB first load.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm application/octet-stream image/svg+xml;

    # nginx's bundled mime.types already maps .wasm to application/wasm — do NOT add a
    # types { } block here, it would replace the inherited map and break css/js.

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Container HEALTHCHECK target — never reaches the SPA fallback.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Rewritten at container start by 10-api-base-url.sh, so it must never be cached.
    location = /appsettings.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The entry point for every deploy: a cached index.html would keep serving the
    # previous build's asset fingerprints.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # .NET 10 embeds the boot config in the fingerprinted loader .js, so this matches
    # nothing today. Kept because earlier and possibly later SDKs emit a plain
    # blazor.boot.json here, which changes every build and must never be cached.
    location ~ ^/_framework/.*\.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Fingerprinted runtime + assemblies: the filename changes when the content does.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Client-side routing: /signin, /temas, /auth-callback etc. have no file on disk,
    # so anything that isn't a real asset is handed to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
