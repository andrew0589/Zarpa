<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña — NavigationES</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #1b4965;
            margin-bottom: 8px;
            font-size: 28px;
        }
        .tagline {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input[type="email"]:focus {
            outline: none;
            border-color: #1b4965;
        }
        .error {
            color: #d32f2f;
            font-size: 13px;
            margin-top: 4px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #1b4965;
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: #0d2438;
        }
        .btn-primary:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .message {
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .message.success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }
        .message.error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #1b4965;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Restablecer Contraseña</h1>
        <p class="tagline">Introduce tu email para recibir un enlace de recuperación</p>

        <div id="messageContainer"></div>

        <form id="forgotForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="nombre@dominio.com">
                <div id="emailError" class="error"></div>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">Enviar Enlace de Recuperación</button>
        </form>

        <div class="back-link">
            <a href="signin">Volver a Iniciar Sesión</a>
        </div>
    </div>

    <script src="js/recaptcha.js"></script>
    <script>
        let apiBaseUrl = 'https://api.navigationes.eu/';
        let recaptchaSiteKey = '';

        // Load API base URL and the reCAPTCHA site key from appsettings.json (written
        // with PascalCase keys by the container entrypoint).
        fetch('/appsettings.json')
            .then(r => r.json())
            .then(config => {
                const url = config && (config.ApiBaseUrl || config.apiBaseUrl);
                if (url) {
                    apiBaseUrl = url.endsWith('/') ? url : url + '/';
                }
                recaptchaSiteKey = (config && config.RecaptchaSiteKey) || '';
                window.navigationesRecaptcha.preload(recaptchaSiteKey);
            })
            .catch(err => console.error('Failed to load appsettings:', err));

        const form = document.getElementById('forgotForm');
        const submitBtn = document.getElementById('submitBtn');
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('emailError');
        const messageContainer = document.getElementById('messageContainer');

        function showMessage(text, type) {
            messageContainer.innerHTML = `<div class="message ${type}">${text}</div>`;
        }

        function clearMessage() {
            messageContainer.innerHTML = '';
        }

        function clearError(el) {
            el.textContent = '';
        }

        emailInput.addEventListener('input', () => clearError(emailError));

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessage();
            clearError(emailError);

            const email = emailInput.value.trim();

            // Validation
            if (!email || !email.includes('@')) {
                emailError.textContent = 'Por favor, introduce un email válido';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Enviando…';

            try {
                const headers = { 'Content-Type': 'application/json' };
                const captchaToken = await window.navigationesRecaptcha.execute(recaptchaSiteKey, 'forgot_password');
                if (captchaToken) {
                    headers['X-Recaptcha-Token'] = captchaToken;
                }

                const response = await fetch(`${apiBaseUrl}api/forgotPassword`, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                // Any other outcome gets the neutral message, so the page does not
                // reveal whether an address has an account.
                if (response.status === 429) {
                    showMessage('Demasiados intentos. Espera unos minutos y vuelve a intentarlo.', 'error');
                } else if (data && data.errorMessage === 'CaptchaFailedError') {
                    showMessage('No hemos podido comprobar que no eres un robot. Recarga la página e inténtalo de nuevo.', 'error');
                } else if (response.ok) {
                    showMessage('✓ Si tu email está registrado, recibirás un enlace de recuperación en breve.', 'success');
                    form.reset();
                } else {
                    showMessage('Error al procesar la solicitud', 'error');
                }
            } catch (err) {
                showMessage('Error de conexión. Intenta más tarde.', 'error');
                console.error('Fetch error:', err);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Enviar Enlace de Recuperación';
            }
        });
    </script>
</body>
</html>
