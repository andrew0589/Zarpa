<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nueva contraseña — NavigationES</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" href="icon-192.png" />
    <style>
        /* .auth-card is a flex column; a <form> child would swallow that layout,
           so it repeats it for the label/input stack inside. */
        #reset-form {
            display: flex;
            flex-direction: column;
        }

        .password-input-group {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 32px;
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            font-size: 18px;
            padding: 0;
        }

        .password-toggle:hover {
            color: #333;
        }

        .password-requirements {
            font-size: 13px;
            color: #666;
            margin-top: 8px;
            line-height: 1.6;
        }

        .requirement {
            margin: 4px 0;
        }

        .requirement.met {
            color: #2e7d32;
        }

        .requirement.unmet {
            color: #d32f2f;
        }

        .requirement::before {
            content: "✗ ";
            font-weight: bold;
        }

        .requirement.met::before {
            content: "✓ ";
        }

        #done {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            text-align: center;
        }

            #done .btn-primary {
                margin-top: 0;
            }
    </style>
</head>

<body>
    <!--
      Landing page for the link in the password-reset email, which AuthService builds
      as {AppSettings:FrontendUrl}/reset-password.html?token=...

      Deliberately plain HTML rather than a Blazor route: it is opened from a mail
      client on a phone, usually once, and has no need of the app's auth state or
      navigation. Loading it costs a few KB instead of the whole WebAssembly bundle,
      and it still works when that bundle does not.
    -->
    <div class="auth-wrap">
        <div class="auth-card">
            <h1>Nueva contraseña</h1>
            <p class="tagline">Elige una contraseña nueva para tu cuenta.</p>

            <form id="reset-form" hidden novalidate>
                <label for="password">Contraseña</label>
                <div class="password-input-group">
                    <input id="password" type="password" autocomplete="new-password"
                           placeholder="••••••••" required />
                    <button type="button" class="password-toggle" id="toggle-password" title="Mostrar/Ocultar">👁</button>
                </div>
                <div class="password-requirements">
                    <div class="requirement unmet" id="req-length">Mínimo 6 caracteres</div>
                    <div class="requirement unmet" id="req-letter">Al menos una letra</div>
                    <div class="requirement unmet" id="req-symbol">Al menos un símbolo (!@#$%^&*)</div>
                </div>
                <p class="field-error" id="password-error" hidden></p>

                <label for="confirm">Confirmar contraseña</label>
                <input id="confirm" type="password" autocomplete="new-password"
                       placeholder="••••••••" required />
                <p class="field-error" id="confirm-error" hidden></p>

                <p class="error" id="form-error" role="alert" hidden></p>

                <button class="btn-primary" id="submit" type="submit" disabled>Guardar contraseña</button>
            </form>

            <div id="done" hidden>
                <div class="completed-check">✓</div>
                <p class="completed-text">Tu contraseña se ha actualizado</p>
                <a class="btn-primary btn-link" href="signin">Iniciar sesión</a>
            </div>

            <p class="error" id="fatal" role="alert" hidden></p>

            <p class="auth-footer" id="footer">
                <a href="signin">Volver a iniciar sesión</a>
            </p>
        </div>
    </div>

    <script>
        (function () {
            // Spanish for the ErrorCodes the API returns. Mirrors the map in
            // Utilities/ErrorMessages.cs — this page can't reach that C# code, so the
            // reset-related entries live here; keep the two in step.
            var UNKNOWN = 'Ha ocurrido un error desconocido. Por favor, inténtalo de nuevo.';
            var MESSAGES = {
                ResetLinkInvalidError: 'Este enlace no es válido o ya se ha utilizado. Solicita uno nuevo.',
                ResetLinkExpiredError: 'El enlace ha caducado. Solo son válidos durante una hora — solicita uno nuevo.',
                PasswordTooShortError: 'La contraseña es demasiado corta',
                PasswordHasSpacesError: 'La contraseña no debe contener espacios',
                UserDoesNotExistError: '¡El usuario no existe!',
                UnknownError: UNKNOWN
            };

            function byId(id) { return document.getElementById(id); }

            var form = byId('reset-form');
            var done = byId('done');
            var fatal = byId('fatal');
            var footer = byId('footer');
            var password = byId('password');
            var confirm = byId('confirm');
            var passwordError = byId('password-error');
            var confirmError = byId('confirm-error');
            var formError = byId('form-error');
            var submit = byId('submit');

            function setError(el, message) {
                el.textContent = message;
                el.hidden = false;
            }

            function clearErrors() {
                [passwordError, confirmError, formError].forEach(function (el) {
                    el.textContent = '';
                    el.hidden = true;
                });
            }

            var token = new URLSearchParams(window.location.search).get('token');
            if (!token) {
                // Reached without the emailed link — there is nothing to reset.
                setError(fatal, 'Falta el código de recuperación. Abre el enlace desde el correo que te hemos enviado.');
                return;
            }

            form.hidden = false;

            // Eye icon toggle
            var toggleBtn = byId('toggle-password');
            toggleBtn.addEventListener('click', function (e) {
                e.preventDefault();
                var isPassword = password.type === 'password';
                password.type = isPassword ? 'text' : 'password';
                toggleBtn.textContent = isPassword ? '👁‍🗨' : '👁';
            });

            // Update requirements on each keystroke
            password.addEventListener('input', updateSubmitButton);
            confirm.addEventListener('input', updateSubmitButton);

            // Same rule as Program.cs: the published appsettings.json carries the real
            // API origin, and a blank value means "dev, API on this host, port 7136".
            var apiBase = (function () {
                return fetch('appsettings.json', { cache: 'no-store' })
                    .then(function (res) { return res.ok ? res.json() : {}; })
                    .catch(function () { return {}; })
                    .then(function (config) {
                        var base = (config.ApiBaseUrl || '').trim();
                        if (!base) base = 'http://' + window.location.hostname + ':7136/';
                        // Without the trailing slash the last path segment is replaced.
                        return base.charAt(base.length - 1) === '/' ? base : base + '/';
                    });
            })();

            function updatePasswordRequirements() {
                var value = password.value;
                var hasLength = value.length >= 6;
                var hasLetter = /[a-zA-Z]/.test(value);
                var hasSymbol = /[!@#$%^&*\-_=+\[\]{};:'",.<>?/\\|`~]/.test(value);

                var reqLength = byId('req-length');
                var reqLetter = byId('req-letter');
                var reqSymbol = byId('req-symbol');

                reqLength.className = 'requirement ' + (hasLength ? 'met' : 'unmet');
                reqLetter.className = 'requirement ' + (hasLetter ? 'met' : 'unmet');
                reqSymbol.className = 'requirement ' + (hasSymbol ? 'met' : 'unmet');

                return hasLength && hasLetter && hasSymbol;
            }

            function updateSubmitButton() {
                var passwordOk = updatePasswordRequirements();
                var confirmOk = password.value === confirm.value && password.value.length > 0;
                submit.disabled = !(passwordOk && confirmOk);
            }

            function validate() {
                var value = password.value;
                var ok = true;

                if (!value.trim()) {
                    setError(passwordError, 'Introduce una contraseña nueva');
                    ok = false;
                } else if (value.length < 6) {
                    setError(passwordError, 'La contraseña es demasiado corta');
                    ok = false;
                } else if (value.indexOf(' ') !== -1) {
                    setError(passwordError, 'La contraseña no debe contener espacios');
                    ok = false;
                } else if (!/[a-zA-Z]/.test(value)) {
                    setError(passwordError, 'La contraseña debe contener al menos una letra');
                    ok = false;
                } else if (!/[!@#$%^&*\-_=+\[\]{};:'",.<>?/\\|`~]/.test(value)) {
                    setError(passwordError, 'La contraseña debe contener al menos un símbolo');
                    ok = false;
                }

                if (value !== confirm.value) {
                    setError(confirmError, 'Las contraseñas no coinciden');
                    ok = false;
                }

                return ok;
            }

            function setBusy(busy) {
                submit.disabled = busy;
                submit.textContent = busy ? 'Guardando…' : 'Guardar contraseña';
            }

            form.addEventListener('submit', function (event) {
                event.preventDefault();
                if (submit.disabled) return;

                clearErrors();
                if (!validate()) return;

                setBusy(true);
                apiBase
                    .then(function (base) {
                        return fetch(base + 'api/resetPassword', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ token: token, newPassword: password.value })
                        });
                    })
                    .then(function (res) {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(function (result) {
                        if (result.isSuccess) {
                            form.hidden = true;
                            footer.hidden = true;
                            done.hidden = false;
                            return;
                        }
                        setError(formError, MESSAGES[String(result.errorMessage || '').trim()] || UNKNOWN);
                    })
                    .catch(function () {
                        setError(formError, 'No se ha podido conectar con el servidor. Inténtalo de nuevo.');
                    })
                    .then(function () { setBusy(false); });
            });
        })();
    </script>
</body>

</html>
